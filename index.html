<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>MalaVerse</title>
<meta name="description" content="A premium digital prayer bead (mala/japa) counter — count your mantras with a tap." />
<meta name="theme-color" content="#1a1a2e" />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MalaVerse" />

<style>
  :root {
    --gold: #ffd966;
    --gold-soft: #ffe9a8;
    --text-primary: #f0e6d0;
    --text-muted: #b8ad9a;
    --card-bg: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.12);
    --green-1: #3fae6a;
    --green-2: #267a4a;
    --red-1: #e8556b;
    --red-2: #b23048;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% 20%, #2d2d44 0%, #1a1a2e 55%, #0f0f1a 100%);
    color: var(--text-primary);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* subtle floating glow orbs for depth */
  .bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }
  .bg-orb.one {
    width: 260px;
    height: 260px;
    background: #ffd966;
    top: -80px;
    left: -60px;
    opacity: 0.12;
  }
  .bg-orb.two {
    width: 320px;
    height: 320px;
    background: #6a5acd;
    bottom: -100px;
    right: -80px;
    opacity: 0.18;
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .card {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    padding: 36px 28px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .card:hover {
    border-color: rgba(255, 217, 102, 0.25);
    box-shadow:
      0 8px 40px rgba(0, 0, 0, 0.5),
      0 0 24px rgba(255, 217, 102, 0.06),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .title-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .app-title {
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
  }

  .app-title span {
    color: var(--gold);
  }

  .counter-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 18px 0;
  }

  .counter {
    font-size: clamp(64px, 22vw, 96px);
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
    text-shadow: 0 0 30px rgba(255, 217, 102, 0.35);
    font-variant-numeric: tabular-nums;
    transition: transform 0.12s ease;
  }

  .counter.pop {
    animation: pop 0.12s ease;
  }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .counter-sub {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .rounds {
    font-size: 12px;
    color: var(--text-muted);
    opacity: 0.8;
    letter-spacing: 0.5px;
  }

  .btn-col {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    outline: none;
  }

  .btn {
    width: 100%;
    min-height: 64px;
    border-radius: 18px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #fff;
    position: relative;
    transition: transform 0.08s ease, filter 0.15s ease, box-shadow 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .btn:active {
    transform: translateY(6px);
  }

  .btn-icon {
    font-size: 22px;
    line-height: 1;
  }

  .btn-primary {
    min-height: 84px;
    font-size: 22px;
    background: linear-gradient(145deg, var(--green-1), var(--green-2));
    box-shadow:
      0 8px 0 #1c5c37,
      0 12px 24px rgba(38, 122, 74, 0.35);
  }

  .btn-primary:active {
    box-shadow:
      0 2px 0 #1c5c37,
      0 4px 12px rgba(38, 122, 74, 0.35);
  }

  .btn-primary:hover {
    filter: brightness(1.08);
  }

  .btn-reset {
    background: linear-gradient(145deg, var(--red-1), var(--red-2));
    box-shadow:
      0 6px 0 #7c1f31,
      0 10px 20px rgba(178, 48, 72, 0.3);
  }

  .btn-reset:active {
    box-shadow:
      0 2px 0 #7c1f31,
      0 4px 12px rgba(178, 48, 72, 0.3);
  }

  .btn-reset:hover {
    filter: brightness(1.08);
  }

  footer {
    margin-top: 26px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .footer-main {
    font-size: 15px;
    color: var(--text-primary);
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .footer-sub {
    font-size: 12px;
    color: var(--text-muted);
  }

  .kbd-hint {
    margin-top: 16px;
    font-size: 11px;
    color: var(--text-muted);
    opacity: 0.7;
    text-align: center;
    line-height: 1.6;
  }

  .kbd-hint kbd {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
    font-size: 10px;
  }

  @media (max-width: 360px) {
    .card { padding: 28px 18px 24px; }
  }

  @media (min-height: 700px) {
    .app { transform: translateY(-10px); }
  }
</style>
</head>
<body>

<div class="bg-orb one"></div>
<div class="bg-orb two"></div>

<div class="app">
  <div class="card">
    <div class="title-row">
      <div class="app-title">Mala<span>Verse</span></div>
    </div>

    <div class="counter-wrap">
      <div class="counter" id="counter" aria-live="polite">0</div>
      <div class="counter-sub">JAPA COUNT</div>
      <div class="rounds" id="rounds">0 malas completed</div>
    </div>

    <div class="btn-col">
      <button class="btn btn-primary" id="incBtn" aria-label="Increment count">
        <span class="btn-icon">🔊</span> Volume Up
      </button>
      <button class="btn btn-reset" id="resetBtn" aria-label="Reset count">
        <span class="btn-icon">⟳</span> Reset
      </button>
    </div>

    <div class="kbd-hint">
      Press <kbd>Space</kbd> or <kbd>+</kbd> to count · <kbd>R</kbd> to reset
    </div>
  </div>

  <footer>
    <div class="footer-main">Ram Ram 🙏</div>
    <div class="footer-sub" id="countLabel">Count: 0</div>
  </footer>
</div>

<script>
  (function () {
    "use strict";

    const STORAGE_KEY = "malaverse-count";
    const BEADS_PER_MALA = 108;

    const counterEl = document.getElementById("counter");
    const roundsEl = document.getElementById("rounds");
    const countLabelEl = document.getElementById("countLabel");
    const incBtn = document.getElementById("incBtn");
    const resetBtn = document.getElementById("resetBtn");

    let count = parseInt(localStorage.getItem(STORAGE_KEY), 10);
    if (isNaN(count) || count < 0) count = 0;

    function vibrate(pattern) {
      if ("vibrate" in navigator) {
        try { navigator.vibrate(pattern); } catch (e) { /* no-op */ }
      }
    }

    function render() {
      counterEl.textContent = count;
      countLabelEl.textContent = "Count: " + count;
      const malas = Math.floor(count / BEADS_PER_MALA);
      roundsEl.textContent = malas + (malas === 1 ? " mala completed" : " malas completed");
    }

    function pop() {
      counterEl.classList.remove("pop");
      // force reflow so the animation can restart
      void counterEl.offsetWidth;
      counterEl.classList.add("pop");
    }

    function increment() {
      count += 1;
      localStorage.setItem(STORAGE_KEY, String(count));
      render();
      pop();
      vibrate(15);
    }

    function reset() {
      if (count === 0) return;
      count = 0;
      localStorage.setItem(STORAGE_KEY, String(count));
      render();
      pop();
      vibrate([20, 40, 20]);
    }

    incBtn.addEventListener("click", increment);
    resetBtn.addEventListener("click", reset);

    document.addEventListener("keydown", function (e) {
      if (e.repeat) return;
      if (e.code === "Space" || e.key === "+" || e.key === "=") {
        e.preventDefault();
        increment();
      } else if (e.key === "r" || e.key === "R") {
        e.preventDefault();
        reset();
      }
    });

    render();

    // Register service worker for offline support
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {
          /* offline registration failures are non-fatal */
        });
      });
    }
  })();
</script>
</body>
</html>
