name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 5. Install Bubblewrap
      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap --version

      # 6. Install HTTP server
      - name: Install HTTP Server
        run: |
          npm install -g http-server

      # 7. Start PWA server
      - name: Serve PWA locally
        run: |
          nohup http-server . -p 8080 --silent > /tmp/http-server.log 2>&1 &
          echo $! > /tmp/http-server.pid

          sleep 5

          echo "Checking PWA manifest..."
          curl -f http://localhost:8080/manifest.json

      # 8. Initialize TWA project
      - name: Initialize TWA Android Project
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          set -e

          rm -rf output
          mkdir -p output
          cd output

          bubblewrap init \
            --manifest http://localhost:8080/manifest.json \
            --directory . \
            --packageId com.mala.verse

      # 9. Configure Android SDK
      - name: Configure Android SDK
        working-directory: ./output
        run: |
          set -e

          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

          echo "Android SDK:"
          ls -la /usr/local/lib/android/sdk

          echo "Java:"
          java -version

      # 10. Build APK
      - name: Build APK
        working-directory: ./output
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          set -e

          echo "Building APK..."

          ./gradlew assembleRelease --no-daemon --stacktrace

      # 11. Find APK
      - name: Find APK
        run: |
          echo "Searching for APK..."

          find ./output \
            -type f \
            -name "*.apk" \
            -print

      # 12. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: malaverse-apk
          path: ./output/**/*.apk
          if-no-files-found: error
          retention-days: 30
